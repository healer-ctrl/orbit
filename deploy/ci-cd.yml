name: MailMind CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Code Quality & Linting ───────────────────────────────────────────────
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Linting
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. Max line length 140 for ops templates.
          flake8 backend --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics

  # ── 2. Automated Tests & Code Coverage ──────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest with Coverage
        run: |
          PYTHONPATH=. pytest backend/tests \
            --cov=backend \
            --cov-report=xml \
            --cov-report=term-missing \
            --verbose

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  # ── 3. Security Vulnerability Scanning ─────────────────────────────────────
  security-scan:
    name: Security & SAST Scanning
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit (SAST Security Analysis)
        run: |
          bandit -r backend -ll -x backend/tests --format custom || true

      - name: Run Pip-Audit (Dependency Vulnerabilities)
        run: |
          pip-audit -r backend/requirements.txt || true

  # ── 4. Container Build & Smoke Verification ────────────────────────────────
  docker-build:
    name: Container Build & Health Smoke Test
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-stage Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runner
          load: true
          tags: mailmind-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container Smoke Test & Health Probes Verification
        run: |
          # Start container in background
          docker run -d --name test-mailmind -p 8000:8000 mailmind-backend:latest
          
          # Wait for container startup
          echo "Waiting for container to become healthy..."
          sleep 4
          
          # Test liveness probe
          curl -f http://localhost:8000/livez || (docker logs test-mailmind && exit 1)
          
          # Test readiness probe
          curl -f http://localhost:8000/readyz || (docker logs test-mailmind && exit 1)
          
          # Test health summary
          curl -f http://localhost:8000/healthz || (docker logs test-mailmind && exit 1)
          
          echo "✅ Container smoke tests passed successfully!"
          docker stop test-mailmind
